services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    volumes: [pgdata:/var/lib/postgresql/data]
  redis: {image: redis:8-alpine}
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sms
      RABBITMQ_DEFAULT_PASS: sms
  api:
    build: ./apps/api
    environment: {PORT: 3000}
    depends_on: [postgres]
  worker:
    build: ./apps/worker
    environment: {RABBITMQ_URL: amqp://sms:sms@rabbitmq:5672}
    depends_on: [rabbitmq]
  web:
    build: ./apps/web
    ports: ["8080:80"]
volumes: {pgdata: {}}