services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sms -d sms"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sms
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    volumes: [rabbitmqdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    expose: ["3000"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: ["node","apps/worker/dist/main.js"]

  importer:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: ["node","apps/worker/dist/import-worker.js"]

  campaign:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: ["node","apps/worker/dist/campaign-worker.js"]

  outbox:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: ["node","apps/worker/dist/outbox-dispatcher.js"]

  dlr:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    command: ["node","apps/worker/dist/dlr-worker.js"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    expose: ["80"]

  nginx:
    build:
      context: infra/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [api,web]
    ports: ["80:80"]
    volumes:
      - nginx_cache:/var/cache/nginx

volumes:
  pgdata: {}
  redisdata: {}
  rabbitmqdata: {}
  nginx_cache: {}
