name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma@6.19.0 validate --schema packages/db/prisma/schema.prisma
      - run: npx prisma@6.19.0 generate --schema packages/db/prisma/schema.prisma
      - run: npm run build
